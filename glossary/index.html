<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glossary · Future Food Production</title>
<meta name="description" content="Searchable glossary of all key terms in Future Food Production, with links to the lessons where each term is explained.">
<script>try{var t=localStorage.getItem('ffp-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..800;1,400..600&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<script src="/assets/js/course-data.js" defer></script>
<script src="/assets/js/site.js" defer></script>
<style>
  .letters { display: flex; flex-wrap: wrap; gap: 4px; margin: 16px 0; }
  .letters a { font: 700 .85rem var(--font-mono); width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); text-decoration: none; color: var(--ink-2); background: var(--bg-elev); }
  .letters a.off { opacity: .3; pointer-events: none; }
  .g-letter { font-family: var(--font-serif); font-size: 2rem; color: var(--accent); margin: 32px 0 8px; border-bottom: 1px solid var(--line); scroll-margin-top: calc(var(--header-h) + 12px); }
  .g-item { display: grid; grid-template-columns: minmax(160px, 260px) 1fr; gap: 18px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .g-item dt { font-weight: 700; }
  .g-item dd { margin: 0; }
  .g-item .src { display: block; margin-top: 4px; font-size: .8rem; }
  .g-item .src a { color: var(--muted); }
  @media (max-width: 640px) { .g-item { grid-template-columns: 1fr; gap: 4px; } }
</style>
</head>
<body data-page="glossary">
<div data-site-header></div>
<main id="main">
  <header class="page-head"><div class="container">
    <div class="breadcrumb"><a href="/">Home</a><span>/</span><span>Glossary</span></div>
    <h1>Glossary</h1>
    <p class="lead">The key terms of the course, gathered from every lesson. Each definition links back to where the concept is developed.</p>
    <input type="text" id="q" placeholder="Search terms…" style="max-width:420px;margin-top:10px" aria-label="Search terms">
    <div class="muted mono" id="status" style="font-size:.8rem;margin-top:10px"></div>
    <nav class="letters" id="letters" aria-label="Jump to letter"></nav>
  </div></header>
  <div class="container narrow" id="out"></div>
</main>
<div data-site-footer></div>
<script type="module">
import { loadIndex } from '/assets/js/aggregate.js';
const ready = () => new Promise(r => (window.FFP && FFP.ready) ? r() : document.addEventListener('ffp:ready', r, { once: true }));
await ready();
const esc = FFP.esc;
const idx = await loadIndex((d, n) => { document.getElementById('status').textContent = `Reading course pages… ${d}/${n}`; });
const map = new Map();
idx.terms.forEach(t => { const k = t.term.toLowerCase().replace(/\s+/g, ' '); if (!map.has(k)) map.set(k, { term: t.term, defs: [] }); map.get(k).defs.push(t); });
const terms = [...map.values()].sort((a, b) => a.term.localeCompare(b.term, 'en', { sensitivity: 'base' }));
document.getElementById('status').textContent = `${terms.length} terms`;
function render(q = '') {
  const w = q.toLowerCase();
  const list = terms.filter(t => !w || t.term.toLowerCase().includes(w) || t.defs.some(d => d.def.toLowerCase().includes(w)));
  const groups = {}; list.forEach(t => { const L = (t.term.match(/[A-Za-z0-9]/) || ['#'])[0].toUpperCase(); (groups[/[0-9]/.test(L) ? '#' : L] = groups[/[0-9]/.test(L) ? '#' : L] || []).push(t); });
  const letters = '#ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  document.getElementById('letters').innerHTML = letters.map(L => `<a href="#g-${L === '#' ? 'num' : L}" class="${groups[L] ? '' : 'off'}">${L}</a>`).join('');
  const out = document.getElementById('out');
  out.innerHTML = letters.filter(L => groups[L]).map(L => `<h2 class="g-letter" id="g-${L === '#' ? 'num' : L}">${L}</h2><dl>${groups[L].map(t => `<div class="g-item"><dt>${esc(t.term)}</dt><dd>${t.defs[0].def}${t.defs.length > 1 ? `<details style="margin-top:6px"><summary class="muted" style="font-size:.85rem;cursor:pointer">${t.defs.length - 1} more definition${t.defs.length > 2 ? 's' : ''} in other lessons</summary>${t.defs.slice(1).map(d => `<p style="margin:6px 0">${d.def} <span class="src"><a href="${d.url}#key-terms">${d.kind === 'lesson' ? 'Lesson ' + d.code : 'Lab'} · ${esc(d.title)}</a></span></p>`).join('')}</details>` : ''}<span class="src"><a href="${t.defs[0].url}#key-terms">${t.defs[0].kind === 'lesson' ? 'Lesson ' + t.defs[0].code : 'Lab'} · ${esc(t.defs[0].title)}</a></span></dd></div>`).join('')}</dl>`).join('') || '<p class="muted">No terms found.</p>';
  FFP.renderMath(out);
}
document.getElementById('q').addEventListener('input', e => render(e.target.value));
render();
</script>
</body>
</html>
