<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D kit gallery · Future Food Production</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/main.css">
<script src="/assets/js/course-data.js" defer></script>
<script src="/assets/js/site.js" defer></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body data-page="doc">
<div data-site-header></div>
<main id="main" class="container" style="padding-top:24px">
  <h1 style="font-size:2rem">3D kit gallery (authoring reference)</h1>
  <p class="muted">Every procedural asset in <code>/assets/js/lab3d.js</code>. Use <code style="overflow-wrap:anywhere">?scene=plants|water|hardware|structures|field</code>.</p>
  <div class="stage" id="stage" style="aspect-ratio:16/9"></div>
</main>
<script type="module">
import { createStage, studioLights, THREE, M, makeLettuce, makeHerb, makeSeedling, makeRoots, makeNetPot, makeRockwoolCube, makeFish, FishSchool, makeTank, makeRaft, makeNFTChannel, makeLEDBar, makeDrone, makeGreenhouse, makeRack, makeFieldCrop, makeGround, addSky, Bubbles, Mist, FlowAlong, makeArrow, makeProbe, makePipe, makeTextSprite } from '/assets/js/lab3d.js';
const q = new URLSearchParams(location.search).get('scene') || 'plants';
const cams = { plants: { pos: [0.55, 0.42, 0.65], target: [0, 0.08, 0] }, water: { pos: [1.4, 1.1, 1.6], target: [0, 0.35, 0] }, hardware: { pos: [1.2, 0.9, 1.3], target: [0, 0.3, 0] }, structures: { pos: [14, 8, 16], target: [0, 2, 0] }, field: { pos: [8, 5, 10], target: [0, 0, 0] } };
const stage = createStage('#stage', { background: q === 'structures' || q === 'field' ? null : '#10161a', camera: cams[q], bloom: { strength: 0.4, threshold: 0.9 }, controls: { maxPolarAngle: Math.PI * 0.49 } });
const { scene } = stage;
if (q === 'structures' || q === 'field') { const sky = addSky(stage, { elevation: 32, azimuth: 150 }); scene.add(makeGround({ size: 80, type: q === 'field' ? 'tilled' : 'grass' })); }
else { studioLights(stage, { shadowSize: 1.5 }); scene.add(makeGround({ size: 6, type: 'concrete' })); }
if (q === 'plants') {
  ['butterhead', 'green', 'red', 'oakleaf', 'romaine'].forEach((v, i) => { const l = makeLettuce({ variety: v, radius: 0.12, seed: i + 2 }); l.position.set(-0.52 + i * 0.26, 0, -0.1); scene.add(l); stage.addLabel([-0.52 + i * 0.26, 0.2, -0.1], v); });
  [0.15, 0.35, 0.6, 1].forEach((g, i) => { const l = makeLettuce({ growth: g, radius: 0.12, seed: 9 + i }); l.position.set(-0.4 + i * 0.26, 0, 0.2); scene.add(l); stage.addLabel([-0.4 + i * 0.26, 0.14, 0.2], 'growth ' + g); });
  const h = makeHerb({}); h.position.set(0.45, 0, 0.25); scene.add(h);
  const s = makeSeedling({}); s.position.set(0.3, 0, 0.35); scene.add(s);
  const pot = makeNetPot({}); pot.position.set(-0.6, 0.3, 0.3); scene.add(pot);
  const r = makeRoots({ length: 0.22 }); r.position.set(-0.6, 0.25, 0.3); scene.add(r);
  const rw = makeRockwoolCube({}); rw.position.set(-0.45, 0.02, 0.4); scene.add(rw);
}
if (q === 'water') {
  const tank = makeTank({ w: 1.2, h: 0.55, d: 0.6, material: 'glass', level: 0.85 }); scene.add(tank);
  const school = new FishSchool(tank, { count: 10, bounds: new THREE.Box3(new THREE.Vector3(-0.5, 0.06, -0.22), new THREE.Vector3(0.5, 0.42, 0.22)) });
  const bub = new Bubbles({ emitters: [[-0.4, 0.03, 0], [0.4, 0.03, 0]], top: tank.levelY, rate: 50 }); tank.add(bub.mesh);
  const raft = makeRaft({ w: 1.1, d: 0.5, nx: 5, nz: 2 }); raft.position.set(0, 1.0, -1.1); scene.add(raft);
  const nft = makeNFTChannel({ length: 1.6, holes: 8 }); nft.position.set(0, 0.8, 0.9); scene.add(nft);
  nft.holes.forEach((hp, i) => { const l = makeLettuce({ radius: 0.07, growth: 0.5 + i * 0.06, seed: i + 30 }); l.position.copy(hp).add(nft.position); scene.add(l); });
  const pipe = makePipe([[0.6, 0.55, 0], [0.8, 0.9, 0.3], [0.8, 0.9, 0.9]], { radius: 0.018 }); scene.add(pipe);
  const flow = new FlowAlong(pipe.curve, { count: 60, speed: 0.4 }); scene.add(flow.points);
  stage.onFrame((dt, t) => { school.update(dt, t); bub.update(dt); tank.update(t); nft.update(t); flow.update(dt); });
}
if (q === 'hardware') {
  const bar = makeLEDBar({ length: 1.0, light: 'rect', lightIntensity: 8 }); bar.position.set(0, 0.6, 0); scene.add(bar);
  const bar2 = makeLEDBar({ length: 1.0, color: 'redblue' }); bar2.position.set(0, 0.35, 0.4); bar2.rotation.x = Math.PI; scene.add(bar2);
  const dr = makeDrone({ size: 0.5 }); dr.position.set(-0.5, 0.3, -0.3); scene.add(dr);
  const pr = makeProbe({}); pr.position.set(0.5, 0, 0.2); scene.add(pr);
  const ar = makeArrow({ from: [0.2, 0.05, -0.3], to: [0.6, 0.4, -0.3], color: 0xf2b94b }); scene.add(ar);
  const mist = new Mist({ nozzles: [{ pos: [-0.2, 0.1, 0.4], dir: [0, 1, 0] }], rate: 800 }); scene.add(mist.points);
  const sp = makeTextSprite('Sprite label'); sp.position.set(0, 0.9, 0); scene.add(sp);
  stage.onFrame(dt => { dr.update(dt); mist.update(dt); });
}
if (q === 'structures') {
  const gh = makeGreenhouse({ spans: 3, length: 12 }); gh.setVents(0.6); gh.setScreen(0.5); scene.add(gh);
  const rack = makeRack({ levels: 4 }); rack.position.set(9, 0, 0); scene.add(rack);
}
if (q === 'field') {
  const crop = makeFieldCrop({ width: 16, depth: 16, height: 0.55, colorFn: (x, z) => new THREE.Color().setHSL(0.22 + 0.05 * Math.sin(x * 0.4), 0.55, 0.3 + 0.08 * Math.cos(z * 0.3)) });
  scene.add(crop); stage.onFrame((dt, t) => crop.update(t));
  const dr = makeDrone({ size: 0.6 }); dr.position.set(0, 3, 0); scene.add(dr); stage.onFrame(dt => dr.update(dt));
}
</script>
</body>
</html>
