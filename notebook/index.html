<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your notebook · Future Food Production</title>
<meta name="description" content="All your notes and saved laboratory investigations from Future Food Production.">
<script>try{var t=localStorage.getItem('ffp-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..800;1,400..600&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<script src="/assets/js/course-data.js" defer></script>
<script src="/assets/js/site.js" defer></script>
<style>
  .note-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-elev); margin: 14px 0; overflow: hidden; }
  .note-card header { display: flex; justify-content: space-between; gap: 12px; padding: 10px 16px; background: var(--bg-sunk); align-items: center; flex-wrap: wrap; }
  .note-card textarea { border: 0; border-radius: 0; min-height: 140px; font-family: var(--font-sans); font-size: .93rem; padding: 14px 16px; }
</style>
</head>
<body data-page="notebook">
<div data-site-header></div>
<main id="main">
  <header class="page-head"><div class="container">
    <div class="breadcrumb"><a href="/">Home</a><span>/</span><span>Your notebook</span></div>
    <h1>Your notebook</h1>
    <p class="lead">Notes you write on any page (press <kbd>N</kbd>) and investigations you save in the laboratories are collected here. Edit them, then download everything as a Markdown file for your lab report.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px"><button class="btn btn-primary" id="b-md" type="button">Download all notes (.md)</button><input type="text" id="q" placeholder="Search notes…" style="max-width:300px" aria-label="Search notes"></div>
  </div></header>
  <div class="container narrow" id="out"></div>
</main>
<div data-site-footer></div>
<script type="module">
const ready = () => new Promise(r => (window.FFP && FFP.ready) ? r() : document.addEventListener('ffp:ready', r, { once: true }));
await ready();
const st = FFP.store, esc = FFP.esc;
function render(q = '') {
  const notes = st.raw().notes || {};
  const entries = Object.entries(notes).filter(([p, n]) => !q || (n.text + ' ' + n.title).toLowerCase().includes(q.toLowerCase())).sort((a, b) => b[1].t - a[1].t);
  const out = document.getElementById('out');
  out.innerHTML = entries.length ? entries.map(([p, n]) => `<article class="note-card" data-path="${esc(p)}"><header><div><a href="${esc(p)}" style="font-weight:650">${esc(n.title.split('·')[0].trim())}</a><div class="muted mono" style="font-size:.75rem">${esc(p)} · ${new Date(n.t).toLocaleString()}</div></div><button class="btn btn-sm btn-ghost" data-act="del" type="button">Delete</button></header><textarea aria-label="Note">${esc(n.text)}</textarea></article>`).join('')
    : '<div class="callout note" style="margin-top:28px"><div class="callout-title">Empty notebook</div><p>Open any lesson or laboratory and press <kbd>N</kbd> (or the notebook icon in the header) to write notes. In laboratories, <em>Save investigation</em> stores your settings and results here automatically.</p></div>';
  out.querySelectorAll('.note-card').forEach(card => {
    const p = card.dataset.path; const ta = card.querySelector('textarea');
    ta.addEventListener('input', () => st.setNote(p, ta.value, (notes[p] || {}).title));
    card.querySelector('[data-act=del]').addEventListener('click', () => { if (confirm('Delete this note?')) { st.setNote(p, ''); render(document.getElementById('q').value); } });
  });
}
document.getElementById('q').addEventListener('input', e => render(e.target.value));
document.getElementById('b-md').addEventListener('click', () => FFP.exportNotes());
render();
</script>
</body>
</html>
