<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratories · Future Food Production</title>
<meta name="description" content="Sixty interactive 2D and 3D laboratories: lighting design, hydroponics, aquaponics, vertical farms, greenhouse climate, sensors, AI, precision agriculture, bioreactors, sensory science, regulation and sustainability assessment.">
<script>try{var t=localStorage.getItem('ffp-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..800;1,400..600&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<script src="/assets/js/course-data.js" defer></script>
<script src="/assets/js/site.js" defer></script>
<style>
  .filter-bar { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; margin: 22px 0 8px; }
  @media (max-width: 760px) { .filter-bar { grid-template-columns: 1fr; } }
  .filter-bar input { max-width: 420px; }
  .mod-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .result-count { font: 500 .85rem var(--font-mono); color: var(--muted); margin-bottom: 14px; }
</style>
</head>
<body data-page="labs">
<div data-site-header></div>
<main id="main">
  <header class="page-head">
    <div class="container">
      <div class="breadcrumb"><a href="/">Home</a><span>/</span><span>Laboratories</span></div>
      <h1>Laboratories</h1>
      <p class="lead">Every laboratory is a working scientific model you can steer. Observe the system, read the explanation, follow the derivation of every equation, then investigate with guided tasks and a quiz. Save investigations to your notebook and share any setting as a link.</p>
    </div>
  </header>
  <div class="container">
    <div class="filter-bar">
      <input type="text" id="q" placeholder="Search laboratories (e.g., oxygen, LED, NDVI, bioreactor)…" aria-label="Search laboratories">
      <div class="seg" id="kind" role="group" aria-label="Laboratory type">
        <button type="button" data-v="all" aria-pressed="true">All</button><button type="button" data-v="3D" aria-pressed="false">3D</button><button type="button" data-v="2D" aria-pressed="false">2D</button>
      </div>
    </div>
    <div class="mod-chips" id="mods"></div>
    <div class="mod-chips" id="los"></div>
    <div class="result-count" id="count"></div>
    <div class="grid grid-3" id="grid"></div>
  </div>
</main>
<div data-site-footer></div>
<script type="module">
import { labCard } from '/assets/js/catalog.js';
const ready = () => new Promise(r => (window.FFP && FFP.ready) ? r() : document.addEventListener('ffp:ready', r, { once: true }));
await ready();
const C = window.FFP_COURSE;
const params = new URLSearchParams(location.search);
const state = { module: params.get('module') || 'all', kind: params.get('kind') || 'all', lo: params.get('lo') || 'all', q: params.get('q') || '' };
const mods = document.getElementById('mods');
mods.innerHTML = `<button class="chip" data-m="all">All modules</button>` + C.modules.map(m => `<button class="chip" data-m="${m.slug}" style="border-left:3px solid ${m.color}">${m.n}. ${m.title.split(':')[0].split(',')[0]}</button>`).join('');
const los = document.getElementById('los');
los.innerHTML = `<button class="chip" data-lo="all">All outcomes</button>` + C.outcomes.map(o => `<button class="chip" data-lo="${o.id}" title="${FFP.esc(o.text)}">${o.id} · ${o.short}</button>`).join('');
const qIn = document.getElementById('q'); qIn.value = state.q;
function render() {
  mods.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === state.module));
  los.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lo === state.lo));
  document.querySelectorAll('#kind button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.kind));
  const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const list = C.labs.filter(l => (state.module === 'all' || l.module === state.module) && (state.kind === 'all' || l.kind === state.kind) && (state.lo === 'all' || l.los.includes(state.lo)) && words.every(w => (l.title + ' ' + l.summary + ' ' + C.moduleIndex[l.module].title).toLowerCase().includes(w)));
  document.getElementById('grid').innerHTML = list.map(labCard).join('') || '<p class="muted">No laboratory matches these filters.</p>';
  const n3 = list.filter(l => l.kind === '3D').length;
  document.getElementById('count').textContent = `${list.length} laboratories · ${n3} in 3D · ${list.length - n3} in 2D`;
  const p = new URLSearchParams(); Object.entries(state).forEach(([k, v]) => { if (v && v !== 'all') p.set(k, v); });
  history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));
}
mods.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.module = b.dataset.m; render(); } });
los.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.lo = b.dataset.lo; render(); } });
document.getElementById('kind').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.kind = b.dataset.v; render(); } });
qIn.addEventListener('input', () => { state.q = qIn.value; render(); });
render();
</script>
</body>
</html>
