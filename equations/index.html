<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equation reference book · Future Food Production</title>
<meta name="description" content="Every equation of the course in one searchable reference book, with symbols, units and links to the full derivations.">
<script>try{var t=localStorage.getItem('ffp-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400..800;1,400..600&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<script src="/assets/js/course-data.js" defer></script>
<script src="/assets/js/site.js" defer></script>
<style>
  .eqb-item { border: 1px solid var(--line); border-radius: 12px; background: var(--bg-elev); margin: 10px 0; overflow: hidden; }
  .eqb-item header { display: flex; justify-content: space-between; gap: 12px; padding: 8px 16px; background: var(--bg-sunk); font-size: .85rem; align-items: center; flex-wrap: wrap; }
  .eqb-item header b { font: 700 .72rem var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .eqb-item .eqb-main { padding: 6px 16px; overflow-x: auto; }
  .eqb-item details { padding: 0 16px 10px; font-size: .9rem; }
  .eqb-item details summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
  .eqb-mod { margin-top: 36px; }
  .eqb-mod h2 { font-size: 1.4rem; border-left: 4px solid var(--mod-color); padding-left: 12px; }
  .eqb-src { font-size: .86rem; margin: 18px 0 4px; font-weight: 650; }
  .loading-bar { height: 4px; background: var(--bg-sunk); border-radius: 4px; overflow: hidden; margin: 14px 0; max-width: 420px; }
  .loading-bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
</style>
</head>
<body data-page="equations">
<div data-site-header></div>
<main id="main">
  <header class="page-head"><div class="container">
    <div class="breadcrumb"><a href="/">Home</a><span>/</span><span>Equation reference book</span></div>
    <h1>Equation reference book</h1>
    <p class="lead">Every equation in the course, collected from the lessons and laboratories — with the plain-language reading and the symbol table. Follow a link to see the full derivation, assumptions, unit check and live calculator.</p>
    <input type="text" id="q" placeholder="Search equations (e.g., DLI, Penman, Monod, Nernst)…" style="max-width:480px;margin-top:10px" aria-label="Search equations">
    <div class="loading-bar" id="lb"><i></i></div><div class="muted mono" id="status" style="font-size:.8rem"></div>
  </div></header>
  <div class="container" id="out"></div>
</main>
<div data-site-footer></div>
<script type="module">
import { loadIndex } from '/assets/js/aggregate.js';
const ready = () => new Promise(r => (window.FFP && FFP.ready) ? r() : document.addEventListener('ffp:ready', r, { once: true }));
await ready();
const C = window.FFP_COURSE, esc = FFP.esc;
const idx = await loadIndex((d, n) => { document.querySelector('#lb i').style.width = (100 * d / n) + '%'; document.getElementById('status').textContent = `Reading course pages… ${d}/${n}`; });
document.getElementById('lb').style.display = 'none';
const eqs = idx.equations;
document.getElementById('status').textContent = `${eqs.length} equations from ${new Set(eqs.map(e => e.url)).size} pages`;
function render(q = '') {
  const w = q.toLowerCase().split(/\s+/).filter(Boolean);
  const list = eqs.filter(e => w.every(x => (e.label + ' ' + e.tex + ' ' + e.title + ' ' + e.read).toLowerCase().includes(x)));
  const html = C.modules.map(m => {
    const mine = list.filter(e => e.module === m.slug); if (!mine.length) return '';
    const bySrc = {}; mine.forEach(e => (bySrc[e.url] = bySrc[e.url] || []).push(e));
    return `<section class="eqb-mod" style="--mod-color:${m.color}"><h2>${m.n}. ${esc(m.title)}</h2>${Object.values(bySrc).map(arr => `<div class="eqb-src">${arr[0].kind === 'lesson' ? 'Lesson ' + arr[0].code : 'Laboratory'} · <a href="${arr[0].url}">${esc(arr[0].title)}</a></div>${arr.map(e => `<article class="eqb-item"><header><b>${esc(e.label)}</b><span class="mono muted">${esc(e.num)} · <a href="${e.url}${e.kind === 'lab' ? '#derive' : (e.id ? '#' + e.id : '')}">derivation →</a></span></header><div class="eqb-main">${esc(e.tex)}</div>${e.read || e.symbols ? `<details><summary>Meaning and symbols</summary>${e.read ? `<p>${e.read}</p>` : ''}${e.symbols}</details>` : ''}</article>`).join('')}`).join('')}</section>`;
  }).join('');
  const out = document.getElementById('out');
  out.innerHTML = html || '<p class="muted" style="margin-top:24px">No equations found.</p>';
  FFP.renderMath(out);
}
let t; document.getElementById('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => render(e.target.value), 200); });
render();
</script>
</body>
</html>
